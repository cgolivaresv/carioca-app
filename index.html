<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Carioca</title><meta name="theme-color" content="#07060d">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css"></head><body>
<div id="fx" aria-hidden="true"><i class="sm s1"></i><i class="sm s2"></i><i class="sm s3"></i><i class="beam b1"></i><i class="beam b2"></i></div>
<h1>Carioca</h1><div id="app"></div>
<div id="home" role="dialog" aria-label="Inicio de Carioca"><div class="hbox">
 <div class="suits" aria-hidden="true"><span>♠</span><span class="r">♥</span><span>♣</span><span class="r">♦</span></div>
 <h2 class="logo">Carioca</h2>
 <div class="rule"></div>
 <p class="tag">Noche de cartas</p>
 <div class="menu">
  <button id="bCont" class="hbtn gold" type="button" hidden>Continuar partida</button>
  <button id="bNew" class="hbtn" type="button">Nueva partida</button>
  <small id="saveNote" class="note" hidden>Empezar de nuevo reemplaza la partida guardada.</small>
  <div class="who"><small>Tu nombre</small><input id="pName" type="text" maxlength="12" placeholder="Escribe tu nombre" autocomplete="off" autocapitalize="words" spellcheck="false"></div>
  <div class="who"><small>Elige tu avatar</small><div id="picks" class="picks"></div></div>
  <div class="who"><small>Rivales en la mesa</small><div id="nbots" class="nb"></div></div>
  <button id="bSnd" class="link" type="button"></button>
  <small class="ver">Versión 0.3.1</small>
 </div>
</div></div>
<script type="module" src="src/app.js"></script></body></html>
