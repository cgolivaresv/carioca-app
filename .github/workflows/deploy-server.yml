# Publica el servidor multijugador en Cloudflare cuando cambia el servidor o las reglas del juego.
# Necesita dos secretos del repositorio: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
name: Desplegar servidor

on:
  push:
    branches: [main]
    paths: ['worker/**', 'src/engine.js', 'src/bots.js', 'src/game.js', 'src/roster.js', 'src/avatars.js', 'wrangler.toml', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas
        run: node --test
      - name: Desplegar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
